name: Android Build

# Gera o APK automaticamente a cada push ou pull request na branch main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Permite disparar manualmente pela aba Actions do GitHub.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Limpar o build
        run: ./gradlew clean

      - name: Gerar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Jogue-Comigo-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
